[package]
name = "echo-island"
version = "0.1.0"
description = "Always-on-top Windows system-audio music recognition island"
authors = ["EchoIsland contributors"]
edition = "2021"
license = "GPL-3.0-or-later"

[lib]
name = "echo_island_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
auricle-capture = "0.3.0"
chrono = { version = "0.4", features = ["serde"] }
parking_lot = "0.12"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
songrec = { package = "songrec-lib", version = "0.5.4" }
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
thiserror = "2"
urlencoding = "2"
uuid = { version = "1", features = ["v4"] }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = ["Win32_Media_Audio", "Win32_System_Com"] }

