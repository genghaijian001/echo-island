name: Windows Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build EchoIsland for Windows
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Clean regenerable cache before build
        run: node scripts/cleanup-regenerable-cache.cjs

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install frontend dependencies
        run: npm ci

      - name: Build Windows app
        run: npm run tauri build

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: EchoIsland-Windows
          if-no-files-found: error
          path: |
            src-tauri/target/release/*.exe
            src-tauri/target/release/bundle/**/*.exe
            src-tauri/target/release/bundle/**/*.msi

      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create $env:GITHUB_REF_NAME `
            --title "EchoIsland $env:GITHUB_REF_NAME" `
            --notes "EchoIsland Windows cloud build. Download the direct executable or installer from the assets below." `
            src-tauri/target/release/*.exe `
            src-tauri/target/release/bundle/nsis/*.exe `
            src-tauri/target/release/bundle/msi/*.msi

      - name: Clean runner cache after packaging
        if: always()
        run: node scripts/cleanup-regenerable-cache.cjs --ci
